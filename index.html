/* =========================================================================
   DATOS: notación, algoritmos y glosario

const MOVE_NAME = { R: "Cara derecha", L: "Cara izquierda", U: "Cara superior", D: "Cara inferior", F: "Cara frontal", B: "Cara trasera" };

function describeMove(mv) {
  const letter = mv[0];
  const suffix = mv.includes("2") ? "180°" : mv.includes("'") ? "sentido antihorario · 90°" : "sentido horario · 90°";
  return `${MOVE_NAME[letter]} (${letter}) — ${suffix}`;
}

function materializeSteps(alg) {
  if (alg.steps) return alg.steps;
  return alg.formula.map((mv) => ({ move: mv, text: describeMove(mv) }));
}

/* Invierte un movimiento: R -> R', R' -> R, R2 -> R2 */
function invertMove(mv) {
  if (mv.includes("2")) return mv;
  if (mv.includes("'")) return mv[0];
  return mv[0] + "'";
}

/* El "caso" que resuelve un algoritmo es, por definición, el resultado de
   aplicarle su secuencia inversa a un cubo resuelto. Por eso preparamos el
   cubo así antes de reproducir la fórmula: al terminar los N pasos, el
   algoritmo deshace exactamente ese setup y el cubo queda resuelto. */
function computeSetup(formula) {
  return [...formula].reverse().map(invertMove);
}

/* Genera una mezcla aleatoria de N movimientos, evitando repetir eje consecutivo */
function generateScramble(length) {
  const faces = ["R", "L", "U", "D", "F", "B"];
  const axisOf = { R: "x", L: "x", U: "y", D: "y", F: "z", B: "z" };
  const suffixes = ["", "'", "2"];
  const seq = [];
  let lastAxis = null;
  for (let i = 0; i < length; i++) {
    let face;
    do { face = faces[Math.floor(Math.random() * faces.length)]; } while (axisOf[face] === lastAxis);
    lastAxis = axisOf[face];
    const suf = suffixes[Math.floor(Math.random() * suffixes.length)];
    seq.push(face + suf);
  }
  return seq;
}

const GLOSSARY = [
  { term: "Notación", def: "Sistema de letras (R, L, U, D, F, B) que indica qué cara girar. Un apóstrofe ( ' ) invierte el sentido y un 2 indica giro doble de 180°." },
  { term: "Capa", def: "Conjunto de piezas que giran juntas al mover una cara del cubo." },
  { term: "Algoritmo", def: "Secuencia fija de movimientos que produce un efecto conocido, usada para resolver una etapa concreta del cubo." },
  { term: "OLL", def: "Orientar Última Capa: paso donde se giran las piezas finales para que todas muestren el mismo color hacia arriba." },
  { term: "PLL / PBL", def: "Permutar Última Capa (PBL en el método Ortega de 2x2): paso donde se colocan en su sitio las piezas ya orientadas." },
  { term: "Cubie", def: "Cada pieza individual del cubo: esquina, arista o centro." },
  { term: "Vista isométrica", def: "Proyección 3D sin distorsión de perspectiva: las tres dimensiones se representan a la misma escala." },
  { term: "Fórmula", def: "La secuencia de movimientos de un algoritmo, escrita en notación estándar, por ejemplo R U R' U'." },
];

const TABS = [
  { id: 2, label: "2×2" },
  { id: 3, label: "3×3" },
];

/* =========================================================================
   MOTOR 3D — genérico para cualquier tamaño de cubo (2, 3, ...)
   ========================================================================= */

const COLORS = {
  white: 0xf4f3ef,
  yellow: 0xffd500,
  red: 0xb8172c,
  orange: 0xff5a1f,
  green: 0x00975f,
  blue: 0x0a54c4,
  inner: 0x14161b,
};

const MOVE_META = {
  R: { axis: "x", layer: (n) => n - 1, sign: -1 },
  L: { axis: "x", layer: () => 0, sign: 1 },
  U: { axis: "y", layer: (n) => n - 1, sign: -1 },
  D: { axis: "y", layer: () => 0, sign: 1 },
  F: { axis: "z", layer: (n) => n - 1, sign: -1 },
  B: { axis: "z", layer: () => 0, sign: 1 },
};

function makeMaterial(hex) {
  return new THREE.MeshStandardMaterial({ color: hex, roughness: 0.55, metalness: 0.06 });
}
const MAT_CACHE = {};
function mat(hex) {
  if (!MAT_CACHE[hex]) MAT_CACHE[hex] = makeMaterial(hex);
  return MAT_CACHE[hex];
}

class RubikEngine {
  constructor(mountEl, n) {
    this.mountEl = mountEl;
    this.n = n;
    this.spacing = 1.03;
    this.cubieSize = 0.94;
    this.busy = false;
    this.disposed = false;

    this.scene = new THREE.Scene();
    this.scene.background = null;

    const frustum = 5;
    const w = mountEl.clientWidth || 400;
    const h = mountEl.clientHeight || 400;
    const aspect = w / h;
    this.camera = new THREE.OrthographicCamera(
      (-frustum * aspect) / 2, (frustum * aspect) / 2, frustum / 2, -frustum / 2, 0.1, 100
    );
    this.spherical = { theta: Math.PI / 4, phi: Math.acos(1 / Math.sqrt(3)), radius: 6.2 };
    this._syncCamera();

    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.setSize(w, h);
    mountEl.innerHTML = "";
    mountEl.appendChild(this.renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x33363f, 0.65);
    this.scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffffff, 0.9);
    key.position.set(5, 8, 6);
    this.scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(-6, -3, -4);
    this.scene.add(fill);

    this.group = new THREE.Group();
    this.scene.add(this.group);

    this.cubies = [];
    this._buildCube(n);

    this._bindPointer();
    this._resizeObserver = new ResizeObserver(() => this._onResize());
    this._resizeObserver.observe(mountEl);

    this._raf = requestAnimationFrame(this._tick);
  }

  _syncCamera() {
    const { theta, phi, radius } = this.spherical;
    this.camera.position.set(
      radius * Math.sin(phi) * Math.sin(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.cos(theta)
    );
    this.camera.lookAt(0, 0, 0);
  }

  _onResize() {
    const w = this.mountEl.clientWidth || 400;
    const h = this.mountEl.clientHeight || 400;
    const aspect = w / h;
    const frustum = 5;
    this.camera.left = (-frustum * aspect) / 2;
    this.camera.right = (frustum * aspect) / 2;
    this.camera.top = frustum / 2;
    this.camera.bottom = -frustum / 2;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h);
  }

  _bindPointer() {
    const el = this.renderer.domElement;
    let dragging = false;
    let lastX = 0, lastY = 0;
    const down = (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; };
    const move = (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      this.spherical.theta -= dx * 0.008;
      this.spherical.phi = Math.min(Math.max(this.spherical.phi - dy * 0.008, 0.25), Math.PI - 0.25);
      this._syncCamera();
    };
    const up = () => { dragging = false; };
    el.addEventListener("pointerdown", down);
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    this._unbindPointer = () => {
      el.removeEventListener("pointerdown", down);
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    };
  }

  _gridToWorld(i, off) { return (i - off) * this.spacing; }

  _buildCube(n) {
    this.n = n;
    while (this.group.children.length) this.group.remove(this.group.children[0]);
    this.cubies = [];
    const off = (n - 1) / 2;
    const geo = new THREE.BoxGeometry(this.cubieSize, this.cubieSize, this.cubieSize);
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        for (let k = 0; k < n; k++) {
          const materials = [
            i === n - 1 ? mat(COLORS.red) : mat(COLORS.inner),
            i === 0 ? mat(COLORS.orange) : mat(COLORS.inner),
            j === n - 1 ? mat(COLORS.white) : mat(COLORS.inner),
            j === 0 ? mat(COLORS.yellow) : mat(COLORS.inner),
            k === n - 1 ? mat(COLORS.green) : mat(COLORS.inner),
            k === 0 ? mat(COLORS.blue) : mat(COLORS.inner),
          ];
          const mesh = new THREE.Mesh(geo, materials);
          mesh.position.set(this._gridToWorld(i, off), this._gridToWorld(j, off), this._gridToWorld(k, off));
          this.group.add(mesh);
          this.cubies.push({ mesh, grid: { x: i, y: j, z: k } });
        }
      }
    }
  }

  reset(n = this.n) { this._buildCube(n); }

  _snap(mesh) {
    const off = (this.n - 1) / 2;
    ["x", "y", "z"].forEach((ax) => {
      const idx = Math.round(mesh.position[ax] / this.spacing + off);
      mesh.position[ax] = (idx - off) * this.spacing;
    });
    const m4 = new THREE.Matrix4().makeRotationFromQuaternion(mesh.quaternion);
    const e = m4.elements;
    [0, 1, 2, 4, 5, 6, 8, 9, 10].forEach((idx) => { e[idx] = Math.round(e[idx]); });
    mesh.quaternion.setFromRotationMatrix(m4);
    return {
      x: Math.round(mesh.position.x / this.spacing + off),
      y: Math.round(mesh.position.y / this.spacing + off),
      z: Math.round(mesh.position.z / this.spacing + off),
    };
  }

  applyMove(moveStr, duration = 320) {
    return new Promise((resolve) => {
      const letter = moveStr[0];
      const meta = MOVE_META[letter];
      if (!meta) return resolve();
      const layerIndex = meta.layer(this.n);
      let angle = (Math.PI / 2) * meta.sign;
      if (moveStr.includes("2")) angle = Math.PI * meta.sign;
      else if (moveStr.includes("'")) angle = -angle;

      const selected = this.cubies.filter((c) => c.grid[meta.axis] === layerIndex);
      const pivot = new THREE.Group();
      this.group.add(pivot);
      selected.forEach((c) => pivot.attach(c.mesh));

      const start = performance.now();
      const ease = (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t);

      const step = (now) => {
        if (this.disposed) return;
        const t = Math.min(1, (now - start) / duration);
        pivot.rotation[meta.axis] = angle * ease(t);
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          selected.forEach((c) => {
            this.group.attach(c.mesh);
            c.grid = this._snap(c.mesh);
          });
          this.group.remove(pivot);
          resolve();
        }
      };
      requestAnimationFrame(step);
    });
  }

  static invert(moveStr) {
    return invertMove(moveStr);
  }

  _tick = () => {
    if (this.disposed) return;
    this.renderer.render(this.scene, this.camera);
    this._raf = requestAnimationFrame(this._tick);
  };

  dispose() {
    this.disposed = true;
    cancelAnimationFrame(this._raf);
    this._resizeObserver?.disconnect();
    this._unbindPointer?.();
    this.renderer.dispose();
    if (this.mountEl) this.mountEl.innerHTML = "";
  }
}

function Keycap({ move, active, dim }) {
  return (
    <span className={`keycap ${active ? "keycap--active" : ""} ${dim ? "keycap--dim" : ""}`}>
      {move}
    </span>
  );
}

function Stage({ engineRef, n, busyRef, busy, setBusy, onExternalChange }) {
  const mountRef = useRef(null);
  const [scrambleSeq, setScrambleSeq] = useState(null);

  useEffect(() => {
    if (!mountRef.current) return;
    engineRef.current = new RubikEngine(mountRef.current, n);
    setScrambleSeq(null);
    return () => { engineRef.current?.dispose(); engineRef.current = null; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [n]);

  const scramble = async () => {
    if (busyRef.current || !engineRef.current) return;
    setBusy(true);
    const length = n === 2 ? 9 : 20;
    const seq = generateScramble(length);
    setScrambleSeq(seq);
    for (const mv of seq) {
      await engineRef.current.applyMove(mv, 150);
    }
    setBusy(false);
    onExternalChange?.();
  };

  const solve = () => {
    if (busyRef.current || !engineRef.current) return;
    engineRef.current.reset(n);
    setScrambleSeq(null);
    onExternalChange?.();
  };

  return (
    <div className="stage-card">
      <div className="stage-canvas" ref={mountRef} />
      <div className="stage-hint">Arrastra para rotar la vista</div>

      <div className="scramble-bar">
        <button className="scramble-btn" onClick={scramble} disabled={busy}>
          <Shuffle size={14} /> Mezclar cubo
        </button>
        <button className="scramble-btn scramble-btn--ghost" onClick={solve} disabled={busy}>
          <RotateCcw size={14} /> Cubo resuelto
        </button>
      </div>

      {scrambleSeq && (
        <div className="scramble-sequence">
          <span className="scramble-label">Mezcla aplicada</span>
          <div className="scramble-moves">
            {scrambleSeq.map((mv, i) => <Keycap key={i} move={mv} />)}
          </div>
        </div>
      )}
    </div>
  );
}

function AlgorithmPanel({ n, engineRef, busyRef, setBusy, resetSignal }) {
  const list = ALGORITHMS[n];
  const [algIdx, setAlgIdx] = useState(0);
  const [stepIdx, setStepIdx] = useState(-1);
  const [isPlaying, setIsPlaying] = useState(false);
  const playRef = useRef(false);

  const alg = list[algIdx];
  const steps = materializeSteps(alg);

  const setupIdRef = useRef(0);

  const setupCase = useCallback(async () => {
    const myId = ++setupIdRef.current;
    engineRef.current?.reset(n);
    setStepIdx(-1);
    if (alg.formula && alg.formula.length) {
      setBusy(true);
      const setup = computeSetup(alg.formula);
      for (const mv of setup) {
        if (setupIdRef.current !== myId) return; // se seleccionó otro algoritmo mientras tanto
        await engineRef.current?.applyMove(mv, 130);
      }
      if (setupIdRef.current === myId) setBusy(false);
    }
  }, [engineRef, n, alg, setBusy]);

  useEffect(() => { setupCase(); setIsPlaying(false); playRef.current = false; }, [algIdx, n, setupCase]);

  // el cubo cambió por fuera de este panel (p. ej. una mezcla): olvida el progreso sin tocar el cubo
  useEffect(() => {
    playRef.current = false;
    setIsPlaying(false);
    setStepIdx(-1);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [resetSignal]);

  const goForward = useCallback(async () => {
    if (busyRef.current || stepIdx + 1 >= steps.length) return;
    setBusy(true);
    const step = steps[stepIdx + 1];
    if (step.move) await engineRef.current?.applyMove(step.move);
    setStepIdx((s) => s + 1);
    setBusy(false);
  }, [stepIdx, steps, engineRef]); // eslint-disable-line

  const goBack = useCallback(async () => {
    if (busyRef.current || stepIdx < 0) return;
    setBusy(true);
    const step = steps[stepIdx];
    if (step.move) await engineRef.current?.applyMove(RubikEngine.invert(step.move));
    setStepIdx((s) => s - 1);
    setBusy(false);
  }, [stepIdx, steps, engineRef]); // eslint-disable-line

  const jumpTo = useCallback(async (target) => {
    if (busyRef.current) return;
    setBusy(true);
    let cur = stepIdx;
    while (cur < target) {
      const step = steps[cur + 1];
      if (step.move) await engineRef.current?.applyMove(step.move, 220);
      cur += 1;
      setStepIdx(cur);
    }
    while (cur > target) {
      const step = steps[cur];
      if (step.move) await engineRef.current?.applyMove(RubikEngine.invert(step.move), 220);
      cur -= 1;
      setStepIdx(cur);
    }
    setBusy(false);
  }, [stepIdx, steps, engineRef]); // eslint-disable-line

  // reproducción automática
  useEffect(() => {
    let cancelled = false;
    async function run() {
      while (playRef.current && !cancelled) {
        if (stepIdx + 1 >= steps.length) { playRef.current = false; setIsPlaying(false); break; }
        await goForward();
        await new Promise((r) => setTimeout(r, 260));
      }
    }
    if (isPlaying) { playRef.current = true; run(); }
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isPlaying]);

  const togglePlay = () => {
    if (isPlaying) { playRef.current = false; setIsPlaying(false); }
    else { if (stepIdx + 1 >= steps.length) return; setIsPlaying(true); }
  };

  const currentMove = stepIdx >= 0 ? steps[stepIdx].move : null;
  const isReady = alg.formula && stepIdx === -1;
  const isSolved = alg.formula && stepIdx === steps.length - 1;

  return (
    <div className="algo-card">
      <div className="algo-tabs">
        {list.map((a, i) => (
          <button
            key={a.id}
            className={`algo-tab ${i === algIdx ? "algo-tab--active" : ""}`}
            onClick={() => { if (!busyRef.current) setAlgIdx(i); }}
          >
            {a.name}
          </button>
        ))}
      </div>

      <div className="algo-body">
        <span className="algo-eyebrow">{alg.tag}</span>
        <h3 className="algo-title">{alg.name}</h3>
        <p className="algo-desc">{alg.description}</p>
        {alg.formula && (
          <p className="algo-note">
            El cubo ya está preparado en el caso que resuelve este algoritmo. Sigue los pasos y comprueba cómo, al llegar al último, queda resuelto.
          </p>
        )}

        {alg.formula && (
          <div className="formula-row">
            {alg.formula.map((mv, i) => (
              <Keycap key={i} move={mv} active={i === stepIdx} dim={i > stepIdx} />
            ))}
          </div>
        )}

        <div className="step-list">
          {steps.map((s, i) => (
            <button
              key={i}
              className={`step-item ${i === stepIdx ? "step-item--active" : ""} ${i < stepIdx ? "step-item--done" : ""}`}
              onClick={() => jumpTo(i)}
            >
              <span className="step-index">{String(i + 1).padStart(2, "0")}</span>
              {s.move && <Keycap move={s.move} active={i === stepIdx} />}
              <span className="step-text">{s.text}</span>
            </button>
          ))}
        </div>
      </div>

      <div className="transport">
        <button className="transport-btn" onClick={goBack} disabled={stepIdx < 0} aria-label="Paso anterior">
          <ChevronLeft size={18} />
        </button>
        <button className="transport-btn transport-btn--play" onClick={togglePlay} aria-label={isPlaying ? "Pausar" : "Reproducir"}>
          {isPlaying ? <Pause size={20} /> : <Play size={20} />}
        </button>
        <button className="transport-btn" onClick={goForward} disabled={stepIdx + 1 >= steps.length} aria-label="Siguiente paso">
          <ChevronRight size={18} />
        </button>
        <div className="transport-progress">
          Paso {Math.max(stepIdx + 1, 0)}/{steps.length}
        </div>
        <button className="transport-reset" onClick={() => { playRef.current = false; setIsPlaying(false); setupCase(); }}>
          <RotateCcw size={14} /> Reiniciar
        </button>
      </div>

      {isSolved ? (
        <div className="status-banner status-banner--solved">
          ✓ Cubo resuelto — así resuelve este algoritmo el caso que tenía preparado.
        </div>
      ) : currentMove ? (
        <div className="status-banner status-banner--move">
          Ejecutando <strong>{currentMove}</strong> — {describeMove(currentMove)}
        </div>
      ) : isReady ? (
        <div className="status-banner status-banner--ready">
          Caso preparado. Dale a play para ver cómo se resuelve.
        </div>
      ) : null}
    </div>
  );
}

function GlossarySection() {
  return (
    <div className="glossary-grid">
      {GLOSSARY.map((g) => (
        <div key={g.term} className="glossary-card">
          <h4>{g.term}</h4>
          <p>{g.def}</p>
        </div>
      ))}
    </div>
  );
}

/* =========================================================================
   APP
   ========================================================================= */

function RubikMania() {
  const [n, setN] = useState(2);
  const [view, setView] = useState("practice"); // practice | glossary
  const [busy, setBusyState] = useState(false);
  const [resetSignal, setResetSignal] = useState(0);
  const engineRef = useRef(null);
  const busyRef = useRef(false);

  const setBusy = useCallback((v) => { busyRef.current = v; setBusyState(v); }, []);
  const notifyExternalChange = useCallback(() => setResetSignal((s) => s + 1), []);

  return (
    <div className="app-root">
      <style>{CSS}</style>

      <header className="header">
        <div className="header-left">
          <div className="logo-mark">
            <span style={{ background: "#f4f3ef" }} />
            <span style={{ background: "#ffd500" }} />
            <span style={{ background: "#b8172c" }} />
            <span style={{ background: "#0a54c4" }} />
          </div>
          <span className="logo-text">RUBIK<span className="logo-accent">MANIA</span></span>
        </div>

        <nav className="header-tabs">
          {TABS.map((t) => (
            <button
              key={t.id}
              className={`nav-tab ${view === "practice" && n === t.id ? "nav-tab--active" : ""}`}
              onClick={() => { setN(t.id); setView("practice"); }}
            >
              <Boxes size={14} /> {t.label}
            </button>
          ))}
        </nav>

        <button
          className={`glossary-btn ${view === "glossary" ? "glossary-btn--active" : ""}`}
          onClick={() => setView(view === "glossary" ? "practice" : "glossary")}
        >
          <BookOpen size={14} /> Glosario
        </button>
      </header>

      <main className="main">
        {view === "practice" ? (
          <div className="practice-grid">
            <Stage
              engineRef={engineRef}
              n={n}
              busyRef={busyRef}
              busy={busy}
              setBusy={setBusy}
              onExternalChange={notifyExternalChange}
            />
            <AlgorithmPanel
              n={n}
              engineRef={engineRef}
              busyRef={busyRef}
              setBusy={setBusy}
              resetSignal={resetSignal}
            />
          </div>
        ) : (
          <>
            <h2 className="section-title">Glosario</h2>
            <GlossarySection />
          </>
        )}
      </main>
    </div>
  );
}

/* =========================================================================
   ESTILOS
   ========================================================================= */

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

html, body { overflow-x: hidden; }
* { box-sizing: border-box; }
img, svg { max-width: 100%; }

.app-root {
  font-family: 'Inter', sans-serif;
  background: #0d0e12;
  color: #e9eaee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- header ---------- */
.header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 28px;
  padding: 14px 24px;
  border-bottom: 1px solid #1e2028;
  background: linear-gradient(180deg, #121319 0%, #0d0e12 100%);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 2px;
  width: 22px;
  height: 22px;
  border-radius: 5px;
  overflow: hidden;
  transform: rotate(-6deg);
}
.logo-mark span { display: block; }
.logo-text {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 19px;
  letter-spacing: 0.01em;
}
.logo-accent { color: #ffd500; }

.header-tabs { display: flex; gap: 6px; margin-left: 8px; }
.nav-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid #23252e;
  background: #15161c;
  color: #9a9ea8;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s ease;
}
.nav-tab:hover { color: #e9eaee; border-color: #33353f; }
.nav-tab--active { background: #ffd500; color: #16171d; border-color: #ffd500; }

.glossary-btn {
  margin-left: auto;
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid #23252e;
  background: transparent;
  color: #9a9ea8;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.glossary-btn:hover { color: #e9eaee; border-color: #33353f; }
.glossary-btn--active { background: #1c1e26; color: #4fd1c5; border-color: #2a3a3a; }

@media (max-width: 560px) {
  .header { padding: 12px 14px; gap: 10px; }
  .header-tabs { order: 3; width: 100%; margin-left: 0; }
  .nav-tab { flex: 1; justify-content: center; }
  .glossary-btn { padding: 7px 10px; font-size: 12px; }
  .logo-text { font-size: 16px; }
}

/* ---------- main layout ---------- */
.main { padding: 22px; flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; min-width: 0; }
.section-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 20px;
  margin: 4px 0 16px;
}

.practice-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 18px;
  align-items: start;
}
/* los hijos de un grid tienen min-width:auto por defecto: si el contenido no
   se encoge (una fila de controles, la fórmula), el track crece y saca la
   página fuera de la pantalla. min-width:0 permite que sí se encojan. */
.practice-grid > * { min-width: 0; }

@media (max-width: 860px) {
  .practice-grid { grid-template-columns: 1fr; }
  .stage-card { position: static; }
}
@media (max-width: 560px) {
  .main { padding: 14px; }
  .practice-grid { gap: 14px; }
}

/* ---------- stage (cube) ---------- */
.stage-card {
  background: radial-gradient(circle at 30% 20%, #1a1c24 0%, #101116 70%);

  border-radius: 16px;
  padding: 6px;

  top: 16px;
}

.stage-hint { text-align: center; font-size: 11px; color: #62656f; padding: 8px 0 4px; letter-spacing: .02em; }

.scramble-bar { display: flex; gap: 8px; padding: 6px 8px 4px; }
.scramble-btn {
  flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 10px;
  border-radius: 10px;
  border: 1px solid #2a2c36;
  background: #ffd500;
  color: #16171d;
  font-size: 12.5px;

  cursor: pointer;

}
.scramble-btn--ghost { background: transparent; color: #c7cad2; border-color: #23252e; }

.scramble-sequence { padding: 4px 10px 10px; }
.scramble-label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: #62656f; margin-bottom: 6px; }

  background: #14151b;
  border: 1px solid #1e2028;

  display: flex;

  background: transparent;

  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.algo-tab--active { background: #1c1e26; color: #e9eaee; }

.algo-body { padding: 16px 18px 4px; flex: 1; }
.algo-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #4fd1c5; font-weight: 600; }
.algo-title { font-family: 'Space Grotesk', sans-serif; font-size: 19px; margin: 4px 0 8px; }
.algo-desc { font-size: 13.5px; color: #a5a8b1; line-height: 1.5; margin-bottom: 14px; min-width: 0; }

.formula-row {
  display: flex; flex-wrap: wrap; gap: 6px;

  background: #101116;

  background: #22242e;
  color: #cfd2da;
  border-bottom: 2px solid #33353f;
}
.keycap--active { background: #ffd500; color: #16171d; border-bottom-color: #c9a900; }
.keycap--dim { opacity: .45; }
